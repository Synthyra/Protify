name: Tests

# The CPU suite on every push and pull request, hermetic as the research workspace runs it: no GPU, no Hub
# downloads, no W&B. GPU, slow, and cached-checkpoint tests run on a workstation instead.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      WANDB_MODE: disabled
      MPLBACKEND: Agg
      CUDA_VISIBLE_DEVICES: ""
      PYTHONHASHSEED: "0"
    steps:
    - uses: actions/checkout@v4
      with:
        # Protify loads FastPLMs, and its feature store, from this submodule.
        submodules: recursive
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-tk
        python -m pip install --upgrade pip
        pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
        pip install -r requirements.txt
    - name: CPU suite
      run: python -m pytest src/protify/testing_suite -q -m "not gpu and not slow and not checkpoint"
