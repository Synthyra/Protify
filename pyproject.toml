[tool.poetry]
name = "Protify"
version = "0.0.6"
description = "Low code molecular property prediction"
authors = ["Synthyra <info@synthyra.com>"]
keywords = ["plm, protein, transformer"]
repository = "https://github.com/Synthyra/Protify"
license = "Apache-2.0"
readme = "README.md"
include = [
    "LICENSE.md",
    "README.md",
]

# `ws publish` vendors foundry and interpnet at the repository root, and protify imports both,
# so the wheel ships them as top-level packages (Logan, 2026-09-24). Another wheel that
# vendors them installs over the same names. The workspace has neither directory here.
packages = [
    { include = "protify", from = "src" },
    { include = "foundry" },
    { include = "interpnet" },
]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
torch = ">=2.14"
transformers = ">=5.17"
huggingface-hub = ">=1.32"
tokenizers = ">=0.23"
safetensors = ">=0.8"
accelerate = ">=1.15.0"
peft = "*"
torchinfo = "*"
scikit-learn = "==1.9.1"
scipy = ">=1.18.1"
datasets = "*"
einops = ">=0.8"
numpy = "==2.5.3"
networkx = ">=3.7"
xgboost = "*"
lightgbm = "*"
pyfiglet = "*"
seaborn = ">=0.13.2"
matplotlib = ">=3.11.2"
sentencepiece = "*"  # runtime backend: T5Tokenizer reads ProtT5's spiece.model through it
optuna = ">=5.0.0"
wandb = ">=0.30.0"
tqdm = ">=4.70.1"
pandas = ">=3.0.6"
requests = ">=2.34.2"
pyyaml = ">=6.0.3"
joblib = ">=1.6.0"
umap-learn = ">=0.5.12"
biopython = ">=1.85"  # interpretability: ProtParam targets of scrambled sequences
pyarrow = ">=25.0.1"  # runtime backend: datasets and pandas load it by name
kernels = ">=0.17.1"  # runtime backend: FastPLMs imports it for the kernels attention backend

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
